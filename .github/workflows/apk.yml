# Arma el APK de prueba de Taotao en GitHub, sin tener el SDK de Android
# en tu compu. Corre en cada PR, en cada push a main y cuando lo pides a mano
# (pestaña Actions → "APK de prueba" → Run workflow).
#
# El APK queda para descargar en la página de la corrida (sección Artifacts).
# En main (push o a mano), además se publica en la versión "apk-de-prueba"
# (pestaña Releases), que es más fácil de bajar desde el celular.
#
# La configuración de Firebase NO está en el repo. Se toma de los secrets:
#   FIREBASE_OPTIONS_DART  → el contenido completo de tu lib/firebase_options.dart
#   GOOGLE_SERVICES_JSON   → (opcional) tu android/app/google-services.json
#   ANDROID_DEBUG_KEYSTORE → (para Entrar con Google) la llave de firma fija en
#                            base64. La crea scripts/llave-android.sh.
# Si faltan, el APK igual se arma, pero al abrirlo dirá que falta configurar
# Firebase. Ver README.md, sección "Probar en el celular sin SDK".
name: APK de prueba

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  revisar:
    name: Revisar código y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: flutter test
        run: flutter test

  apk:
    name: Armar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      # Java 21: el lint del APK release (lintVitalAnalyzeRelease) usa
      # List.removeLast(), que no existe en Java 17 y hace fallar la compilación.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Firma del APK. Con el secret ANDROID_DEBUG_KEYSTORE la llave es
      # siempre la misma, y sus huellas (SHA-1/SHA-256) quedan registradas en
      # Firebase: sin eso "Entrar con Google" falla con invalid-cert-hash.
      # Sin el secret, se recuerda la llave de la corrida anterior (sirve para
      # instalar encima, pero GitHub la borra si pasa una semana sin usarse).
      - name: Poner la llave de firma fija
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          echo "✅ Llave de firma tomada del secret."

      - name: Recordar la llave de firma de prueba
        if: env.ANDROID_DEBUG_KEYSTORE == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: taotao-debug-keystore

      - name: Poner la configuración de Firebase
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
            echo "✅ firebase_options.dart tomado del secret."
          else
            echo "::warning title=Falta Firebase::No hay secret FIREBASE_OPTIONS_DART. El APK se arma, pero al abrirlo pedirá configurar Firebase."
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json tomado del secret."
          fi

      - run: flutter pub get

      # APK "release" (el de verdad, no el de depuración): pesa ~30 MB en vez
      # de 187 MB, abre más rápido, y algunos celulares (Xiaomi) rechazan el
      # de depuración con "el paquete no es válido". Se firma con la misma
      # llave de arriba (ver android/app/build.gradle.kts), así Google sigue
      # funcionando. Un APK por tipo de celular (casi todos son arm64), y el
      # número de compilación sube en cada corrida.
      - name: Armar el APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      # Revisa el APK con las herramientas oficiales de Android antes de
      # publicarlo: si la firma o el paquete están mal, la corrida falla aquí.
      - name: Revisar que el APK sea válido
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
                     build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$bt/apksigner" verify --verbose "$apk" | head -6
            "$bt/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):"
          done

      - name: Mostrar las huellas de la firma
        run: |
          huellas=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey | grep -E 'SHA(1|256):' || true)
          echo "$huellas"
          {
            echo "### Huellas de la firma del APK"
            echo
            echo "Deben estar en Firebase → Configuración del proyecto → tu app Android."
            echo
            echo '```'
            echo "$huellas"
            echo '```'
            if [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
              echo
              echo "⚠️ Falta el secret ANDROID_DEBUG_KEYSTORE: estas huellas pueden cambiar. Corre \`bash scripts/llave-android.sh\` en tu compu."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ponerle nombre al APK
        id: nombre
        run: |
          corto=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            nombre="taotao-pr${{ github.event.pull_request.number }}-${corto}.apk"
          else
            nombre="taotao-${corto}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$nombre"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "${nombre%.apk}-32bits.apk"
          echo "archivo=$nombre" >> "$GITHUB_OUTPUT"
          echo "archivo32=${nombre%.apk}-32bits.apk" >> "$GITHUB_OUTPUT"

      - name: Subir el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: |
            ${{ steps.nombre.outputs.archivo }}
            ${{ steps.nombre.outputs.archivo32 }}
          retention-days: 14

      - name: Publicar en Releases (solo main, también a mano)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.nombre.outputs.archivo }}" taotao.apk
          cp "${{ steps.nombre.outputs.archivo32 }}" taotao-32bits.apk
          notas="APK de prueba armado desde el commit ${GITHUB_SHA::7} (compilación ${{ github.run_number }}).

          Descarga **taotao.apk** desde el celular y ábrelo para instalar. Solo si tu celular es muy viejo y ese no abre, usa taotao-32bits.apk.

          Si Android dice \"el paquete no es válido\" o \"entra en conflicto\": desinstala primero la versión de 星月/Taotao que ya tienes y vuelve a instalar. Pasa cuando la app instalada se firmó con otra llave."
          # Se reemplazan los archivos sin borrar la versión, así nunca queda
          # un rato sin APK para descargar (ni a medias si se cancela la corrida).
          if gh release view apk-de-prueba >/dev/null 2>&1; then
            gh release upload apk-de-prueba taotao.apk taotao-32bits.apk --clobber
            gh release edit apk-de-prueba --notes "$notas"
          else
            gh release create apk-de-prueba taotao.apk taotao-32bits.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "APK de prueba (último main)" \
              --notes "$notas"
          fi
