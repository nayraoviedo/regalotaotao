<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ícono de 星月 (你是我的星的月): luna creciente crema con los dos gatitos
       acurrucados y una estrellita amarilla. Los gatitos vienen de
       ../inicio_cielo.svg. Para cambiarlo por tu dibujo, mira LEEME.md. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2B63"/>
      <stop offset="1" stop-color="#2E3F82"/>
    </linearGradient>
    <symbol id="brillo" viewBox="-10 -10 20 20">
      <path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z"/>
    </symbol>
    <!-- lo que asome por fuera de la luna (patitas) no se ve -->
    <clipPath id="dentro-luna">
      <circle cx="512" cy="430" r="400"/>
      <rect x="0" y="0" width="1024" height="430"/>
    </clipPath>
    <mask id="creciente">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="430" r="400" fill="#fff"/>
      <circle cx="512" cy="300" r="420" fill="#000"/>
    </mask>
  </defs>
  <!-- Fondo azul marino -->
  <rect width="1024" height="1024" fill="url(#cielo)"/>
  <g fill="#FFFFFF">
    <circle cx="170" cy="230" r="7" opacity=".7"/>
    <circle cx="250" cy="140" r="5" opacity=".6"/>
    <circle cx="860" cy="330" r="6" opacity=".7"/>
    <circle cx="880" cy="150" r="5" opacity=".5"/>
    <circle cx="130" cy="420" r="5" opacity=".5"/>
    <circle cx="660" cy="110" r="5" opacity=".6"/>
  </g>
  <use href="#brillo" x="300" y="300" width="40" height="40" transform="translate(-20 -20)" fill="#FFFFFF" opacity=".8"/>

  <!-- Gatitos acurrucados (quedan dentro de la luna) -->
  <g clip-path="url(#dentro-luna)">
  <!-- pelito naranja que rellena el fondo de la cunita (sin huecos azules) -->
  <ellipse cx="470" cy="715" rx="300" ry="75" fill="#F2A65A"/>
  <g transform="translate(512 560) scale(1.22) translate(-822 -672)">
