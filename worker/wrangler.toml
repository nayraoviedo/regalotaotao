# Configuración del Worker de notificaciones de Taotao.
# La clave de la cuenta de servicio NO va aquí: se guarda como secreto con
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
# (ver README.md, sección "Notificaciones push").
name = "taotao-notificaciones"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Cada minuto revisa los recordatorios de las notas (src/recordatorios.js).
# Los Cron Triggers son gratis en el plan Free de Cloudflare.
[triggers]
crons = ["* * * * *"]
